[workspace]
members = [
    ".",
    "crates/aui-core-domain",
    "crates/aui-core-ports",
    "crates/aui-core-engine",
    "crates/aui-runtime-native",
    "crates/aui-bridge",
    "crates/aui-ui-tui",
    "crates/aui-ui-web",
]

[package]
name = "aui"
version = "0.1.0"
edition = "2024"

[dependencies]
aui-core-domain = { path = "crates/aui-core-domain" }
aui-core-engine = { path = "crates/aui-core-engine" }
aui-core-ports = { path = "crates/aui-core-ports" }
aui-runtime-native = { path = "crates/aui-runtime-native" }
gpui = "0.2.2"
unicode-segmentation = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }

[dev-dependencies]
tempfile = "3.24"
gpui = { version = "0.2.2", features = ["test-support"] }
