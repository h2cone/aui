[package]
name = "aui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
unicode-segmentation = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }

[dev-dependencies]
tempfile = "3.10"
gpui = { version = "0.2.2", features = ["test-support"] }
