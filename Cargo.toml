[workspace]
members = [
    ".",
    "crates/aui-ai",
    "crates/aui-agent-core",
    "crates/aui-ui-tui",
    "crates/aui-ui-web",
]

[package]
name = "aui"
version = "0.1.0"
edition = "2024"

[dependencies]
aui-ai = { path = "crates/aui-ai" }
aui-agent-core = { path = "crates/aui-agent-core" }
gpui = "0.2.2"
unicode-segmentation = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }

[dev-dependencies]
tempfile = "3.24"
gpui = { version = "0.2.2", features = ["test-support"] }
